name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -m compileall -q src
      - run: python -m unittest discover -s tests -v
      - run: ga-lab verify --repo . --config .ga-lab-verify.toml --output-dir .ga-lab/ci
