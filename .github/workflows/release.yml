name: Publish Release and Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install GA LAB and build tooling
        run: python -m pip install . build

      - name: Compile production package
        run: python -m compileall -q src

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify exact release SHA
        run: ga-lab verify --repo . --config .ga-lab-verify.toml --output-dir .ga-lab/release

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; immutable release assets will not be replaced."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Python release artifacts
        if: steps.existing.outputs.exists == 'false'
        run: python -m build

      - name: Log in to GitHub Container Registry
        if: steps.existing.outputs.exists == 'false'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build container package
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          IMAGE="ghcr.io/checken1994/ga-lab-verify"
          docker build \
            --label "org.opencontainers.image.title=GA LAB" \
            --label "org.opencontainers.image.description=Evidence-first verification for AI-generated code changes" \
            --label "org.opencontainers.image.source=https://github.com/checken1994/GA-LAB-Verify" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.licenses=LicenseRef-Proprietary" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:v$VERSION" \
            -t "$IMAGE:latest" \
            .

      - name: Push container package
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          IMAGE="ghcr.io/checken1994/ga-lab-verify"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:v$VERSION"
          docker push "$IMAGE:latest"

      - name: Prepare release notes
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          REPORT_JSON="$(find .ga-lab/release -maxdepth 1 -name '*.json' -type f | head -n 1)"
          EVIDENCE_SHA="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["evidence_sha256"])' "$REPORT_JSON")"
          cat > release-notes.md <<EOF
          # GA LAB v$VERSION

          First production-oriented public release of GA LAB, the evidence-first verification gate derived from verification principles developed in SCP (Self-Correcting Platform).

          ## Release authority

          - Release SHA: \`$GITHUB_SHA\`
          - GA LAB evidence SHA-256: \`$EVIDENCE_SHA\`
          - Mandatory unit tests: passed in this publish job
          - GA LAB self-verification: \`SAFE_TO_MERGE\` for the exact release SHA

          ## Distribution

          Python wheel and source distribution are attached to this Release together with the SHA-bound JSON/Markdown verification report.

          Container package:

          \`\`\`bash
          docker pull ghcr.io/checken1994/ga-lab-verify:$VERSION
          \`\`\`

          The verdict and evidence are scoped to the checks recorded in the attached report. They are not a claim that every possible defect is absent.
          EOF

      - name: Create immutable GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" \
            dist/* \
            .ga-lab/release/*.json \
            .ga-lab/release/*.md \
            --target "$GITHUB_SHA" \
            --title "GA LAB v$VERSION" \
            --notes-file release-notes.md
